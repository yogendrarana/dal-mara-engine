name: Publish to npm

on:
  push:
    tags:
      - "v*"


permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Generate changelog
        id: changelog
        run: |
          DELIMITER="CHANGELOG_EOF_$(date +%s)"

          # Handle initial release (no previous tags)
          if ! git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            echo "body<<$DELIMITER" >> $GITHUB_OUTPUT
            echo "## Initial Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log --pretty=format:'* %s - [%h](https://github.com/${{ github.repository }}/commit/%H) by %an' --no-merges >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$DELIMITER" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^)
          echo "Last tag: $LAST_TAG"

          # Format commits with Git author name (no @ mention)
          NOTES=$(git log $LAST_TAG..HEAD \
            --pretty=format:'* %s - [%h](https://github.com/${{ github.repository }}/commit/%H) by %an' \
            --no-merges)

          if [ -z "$NOTES" ]; then
            NOTES="* No significant changes"
          fi

          echo "body<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "## Changes since $LAST_TAG" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST_TAG...${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Dry-run publish (safety check)
        run: npm publish --dry-run --access public --no-git-checks

      - name: Publish to npm
        run: npm publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
